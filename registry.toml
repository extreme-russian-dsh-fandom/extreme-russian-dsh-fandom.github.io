[[excluded]]
repo = "EDSH"
reason = "ECC fork: not a plugin, has no dsh object in the root package.json"

[[excluded]]
repo = "clanker-playground"
reason = "no dsh- prefix; not published as a plugin"

[[excluded]]
repo = ".github"
reason = "organization profile repository"

[[excluded]]
repo = "extreme-russian-dsh-fandom.github.io"
reason = "this site"
